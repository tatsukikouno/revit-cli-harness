name: Publish NuGet Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_publish: ${{ steps.resolve.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Tag push detected: publishing v${VERSION}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -n1)
          if [[ -z "$VERSION" ]]; then
            echo "Could not resolve <Version> from Directory.Build.props" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "v${VERSION} is already tagged; skipping publish."
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tagging new release v${VERSION}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build revit-cli-harness.sln -c Release -p:Version=${{ needs.resolve-version.outputs.version }}

      - name: Pack Contracts
        run: dotnet pack src/RevitHarness.Contracts -c Release -p:Version=${{ needs.resolve-version.outputs.version }} -p:Platform=x64 --no-build -o ./nupkgs

      - name: Pack CLI
        run: dotnet pack src/RevitHarness.Cli -c Release -p:Version=${{ needs.resolve-version.outputs.version }} -p:Platform=x64 --no-build -o ./nupkgs

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: bash
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
